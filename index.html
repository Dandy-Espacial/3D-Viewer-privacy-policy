<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legal & Soporte - 3D Viewer</title>
  <style>
    :root {
      --bg: #090d16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(56, 189, 248, 0.4);
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #818cf8 50%, #c084fc 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background-color: var(--bg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: var(--text-main);
      padding: 1.5rem;
      position: relative;
      overflow-x: hidden;
    }

    /* Luces de fondo ambientales */
    body::before,
    body::after {
      content: "";
      position: absolute;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.18;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      background: #38bdf8;
      top: 15%;
      left: 10%;
    }

    body::after {
      background: #c084fc;
      bottom: 15%;
      right: 10%;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      text-align: center;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      padding: 2.5rem 2rem;
      border-radius: 24px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Icono 3D interactivo */
    .app-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 1.25rem;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.15), rgba(129, 140, 248, 0.15));
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .container:hover .app-icon {
      transform: scale(1.06) rotate(4deg);
    }

    .app-icon svg {
      width: 34px;
      height: 34px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Tipografía de marca */
    h1 {
      font-size: 2.1rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.35rem;
    }

    .developer-meta {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
    }

    .developer-meta strong {
      color: var(--text-main);
      font-weight: 600;
    }

    .meta-separator {
      color: rgba(255, 255, 255, 0.2);
    }

    /* Enlaces interactivos */
    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .btn-left {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .btn svg.icon-main {
      width: 20px;
      height: 20px;
      color: var(--accent);
      stroke-width: 2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn svg.icon-arrow {
      width: 18px;
      height: 18px;
      color: var(--text-muted);
      transition: transform 0.2s ease, color 0.2s ease;
      stroke-width: 2.2;
      fill: none;
      stroke: currentColor;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.07);
      border-color: var(--card-hover-border);
      transform: translateY(-2px);
    }

    .btn:hover svg.icon-arrow {
      color: var(--accent);
      transform: translateX(3px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    /* Footer discreto */
    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Icono 3D Cube -->
    <div class="app-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24">
        <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
        <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
        <line x1="12" y1="22.08" x2="12" y2="12"></line>
      </svg>
    </div>

    <!-- Título y autoría -->
    <h1>3D Viewer</h1>
    <div class="developer-meta">
      <span>Desarrollado por <strong>LambDev</strong></span>
      <span class="meta-separator">•</span>
      <span><strong>Flockred</strong></span>
    </div>

    <!-- Enlaces directos -->
    <nav class="nav-links">
      <a class="btn" href="./privacy/">
        <span class="btn-left">
          <svg class="icon-main" viewBox="0 0 24 24">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
          </svg>
          Política de Privacidad
        </span>
        <svg class="icon-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>

      <a class="btn" href="./terms/">
        <span class="btn-left">
          <svg class="icon-main" viewBox="0 0 24 24">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          Términos y Condiciones
        </span>
        <svg class="icon-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"></polyline></svg>
      </a>
    </nav>

    <footer>
      Documentación Legal y Soporte Oficial
    </footer>
  </main>

</body>
</html>
